  <!-- Center Symbol -->
  <g transform="translate(100, 100)">
    
    <!-- Royal Security Shield & Lock -->
    <!-- Outer Shield Frame -->
    <path d="M0 -36 C18 -36, 30 -28, 30 -12 C30 14, 16 28, 0 36 C-16 28, -30 14, -30 -12 C-30 -28, -18 -36, 0 -36 Z" fill="url(#goldMetal)"/>
    <path d="M0 -31 C14 -31, 24 -24, 24 -10 C24 12, 12 24, 0 31 C-12 24, -24 12, -24 -10 C-24 -24, -14 -31, 0 -31 Z" fill="url(#navyBg)" stroke="url(#goldHighlight)" stroke-width="1.5"/>
    
    <!-- Central Padlock Body -->
    <rect x="-12" y="-4" width="24" height="20" rx="4" fill="url(#goldHighlight)"/>
    <!-- Lock Shackle Arc -->
    <path d="M-7 -4 L-7 -12 C-7 -17, 7 -17, 7 -12 L7 -4" fill="none" stroke="url(#goldHighlight)" stroke-width="3.5" stroke-linecap="round"/>
    <!-- Keyhole -->
    <circle cx="0" cy="4" r="3" fill="url(#navyBg)"/>
    <polygon points="-1.5,4 1.5,4 2,11 -2,11" fill="url(#navyBg)"/>

