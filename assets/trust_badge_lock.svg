<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="goldMetal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF6CC"/>
      <stop offset="25%" stop-color="#F7CA45"/>
      <stop offset="50%" stop-color="#D49E24"/>
      <stop offset="75%" stop-color="#F7CA45"/>
      <stop offset="100%" stop-color="#8A5E0B"/>
    </linearGradient>
    <linearGradient id="goldHighlight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="50%" stop-color="#FFEAA7"/>
      <stop offset="100%" stop-color="#F7CA45"/>
    </linearGradient>
    <radialGradient id="navyBg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#092552"/>
      <stop offset="70%" stop-color="#04122B"/>
      <stop offset="100%" stop-color="#020918"/>
    </radialGradient>
    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Outer Ambient Glow Circle -->
  <circle cx="100" cy="100" r="96" fill="none" stroke="#F7CA45" stroke-width="1" opacity="0.4" filter="url(#goldGlow)"/>
  
